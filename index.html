<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super A'Can 線上模擬器 - Funtech 經典再現</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Custom Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        /* Default: Fit Mode */
        #canvas {
            width: 100% !important;
            height: auto !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 2px var(--primary-color);
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            margin: 0 auto;
        }

        /* 2x Native Mode */
        #canvas.native-scale {
            width: 640px !important;
            height: 480px !important;
            max-width: none !important;
            max-height: none !important;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #1a1a1a;
            border: 2px solid var(--primary-color);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255, 61, 0, 0.3);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        .modal-title {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }
        .modal-body {
            color: #ccc;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        /* Debug Drawer */
        .debug-drawer {
            position: fixed;
            bottom: -280px; /* Hide full height */
            right: 20px;
            width: 350px;
            height: 280px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #444;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            z-index: 10000;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
        }
        /* Info Panel */
        .info-panel {
            width: 300px;
            height: 100%;
            min-height: 0;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            flex-shrink: 0;
        }

        .info-panel.collapsed {
            transform: translateX(100%);
            margin-right: -300px;
        }
        .debug-drawer.active {
            bottom: 0;
        }
        .debug-handle {
            width: 60px;
            height: 24px;
            background: #333;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 6px 6px 0 0;
            border: 1px solid #444;
            border-bottom: none;
            position: absolute;
            top: -24px;
            right: 20px;
            transition: background 0.2s, color 0.2s;
        }
        .debug-handle:hover {
            background: #333;
            color: var(--primary-color);
        }
        
        .debug-drawer.active .debug-handle {
            top: 0;
            border-radius: 0 0 6px 6px;
            border-top: none;
            border-bottom: 1px solid #444;
        }
        #debugLog {
            flex: 1;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            color: #0f0;
            overflow-y: auto;
            user-select: text;
        }
    </style>

        function updateUIStrings() {
            const t = langMap[currentLang];
            const h1 = document.querySelector('.header-left h1');
            if (h1) h1.textContent = t.title;
            
            const subTitle = document.getElementById('subTitle');
            if (subTitle) subTitle.textContent = t.subtitle;
            document.getElementById('searchBox').placeholder = t.searchPlaceholder;
            
            const consoleLink = document.getElementById('consoleLink');
            if (consoleLink) consoleLink.title = t.consoleManual;
            
            const logoLink = document.getElementById('logoLink');
            if (logoLink) logoLink.title = t.logoSpecial;
            document.getElementById('langToggle').textContent = t.langBtn;
            document.getElementById('loadingTip').textContent = t.loading;
            
            // Buttons
            const muteBtn = document.getElementById('muteBtn');
            const isMuted = muteBtn.textContent.includes('取消') || muteBtn.textContent.includes('Unmute');
            muteBtn.textContent = isMuted ? t.unmute : t.mute;
            document.getElementById('reloadBtn').textContent = t.reload;
            document.getElementById('fullscreenBtn').textContent = t.fullscreen;
            
            const scaleBtn = document.getElementById('scaleBtn');
            const isNative = document.getElementById('canvas').classList.contains('native-scale');
            scaleBtn.textContent = isNative ? t.scaleFit : t.scaleNative;

            const videoBtn = document.getElementById('videoBtn');
            if (videoBtn) {
                videoBtn.textContent = window.videoMode === 'accel' ? t.videoAccel : t.videoSoft;
                videoBtn.title = t.videoTitle;
            }
            const soundBtn = document.getElementById('soundBtn');
            if (soundBtn) {
                soundBtn.title = t.soundTitle;
                if (window.soundMode === 'fixed') soundBtn.textContent = t.soundFixed;
                else if (window.soundMode === 'original') soundBtn.textContent = t.soundOriginal;
                else soundBtn.textContent = t.soundAuto;
            }

            const welcomeContent = document.querySelector('.welcome-content p');
            if (welcomeContent) {
                welcomeContent.innerHTML = `${t.welcomeTitle}<br>${t.welcomeTip}`;
            }

            // Update Global UI Labels
            const sections = document.querySelectorAll('.info-section h4');
            if (sections.length >= 4) {
                sections[0].textContent = t.gameInfo;
                sections[1].textContent = t.controls;
                sections[2].textContent = t.mameKeys;
                sections[3].textContent = t.aboutAcan;
            }

            const tableHeader = document.getElementById('tableHeader');
            if (tableHeader) {
                tableHeader.innerHTML = t.p1p2Cols.map(c => `<th>${c}</th>`).join('');
            }
            const tableBody = document.getElementById('tableBody');
            if (tableBody) {
                tableBody.innerHTML = t.p1p2Data.map(row => 
                    `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
                ).join('');
            }

            const mameHeader = document.getElementById('mameHeader');
            if (mameHeader) {
                mameHeader.innerHTML = t.mameCols.map(c => `<th>${c}</th>`).join('');
            }
            const mameBody = document.getElementById('mameBody');
            if (mameBody) {
                mameBody.innerHTML = t.mameData.map(row => 
                    `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
                ).join('');
            }

            const aboutText = document.getElementById('aboutText');
            if (aboutText) {
                aboutText.textContent = t.history;
            }

            const specsText = document.getElementById('specsText');
            if (specsText) {
                specsText.innerHTML = t.specs.replace(/\n/g, '<br>');
            }

            // Refresh current game info if selected
            if (currentGame) {
                updateInfoPanel(currentGame);
            }

            document.getElementById('modalConfirm').textContent = t.confirm;
            document.getElementById('modalCancel').textContent = t.cancel;

            renderGames(document.getElementById('searchBox').value);
        }

        // Elements
        const gameList = document.getElementById('gameList');
        const searchBox = document.getElementById('searchBox');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const emulatorContainer = document.getElementById('emulatorContainer');
        const gameTitleBar = document.getElementById('gameTitleBar');
        const loadingTip = document.getElementById('loadingTip');

        // Initialization
        window.addEventListener('load', () => {
            updateUIStrings(); // Populate all labels and content immediately
            setupInteractions();
            checkAutoStart();
        });

        // Global callback for loader status
        window.onEmulatorStatus = (text) => {
            if (text && text.includes('Preparing')) {
                loadingTip.classList.remove('hidden');
            } else if (!text || text.includes('complete')) {
                setTimeout(() => loadingTip.classList.add('hidden'), 2000);
            }
        };

        function renderGames(filter = '') {
            gameList.innerHTML = '';
            const filterLower = filter.toLowerCase();
            const filtered = window.games.filter(g => 
                g.name.toLowerCase().includes(filterLower) || 
                g.nameCh.toLowerCase().includes(filterLower)
            );
            const noisyGames = ['formduel', 'jttlaugh', 'speedyd', 'staiwbbl'];

            filtered.forEach(game => {
                const item = document.createElement('div');
                item.className = `game-item ${currentGame?.id === game.id ? 'active' : ''}`;
                const displayName = currentLang === 'zh' ? game.nameCh : game.name;
                const subName = currentLang === 'zh' ? game.name : game.nameCh;
                
                const isNoisy = noisyGames.includes(game.id);
                const soundStatus = currentLang === 'zh' ? 
                    (isNoisy ? '音訊: 自動 = 修正' : '音訊: 自動 = 標準') : 
                    (isNoisy ? 'Sound: Auto = Fixed' : 'Sound: Auto = Original');
                const soundColor = isNoisy ? '#00ff00' : '#888';

                item.innerHTML = `
                    <div class="game-item-info">
                        <h3>${displayName}</h3>
                        <div class="name-en">${subName}</div>
                        <div class="meta">📅 ${game.year} | 🎮 ${game.genre}</div>
                        <div style="font-size: 11px; color: ${soundColor}; margin-top: 4px; font-family: monospace;">${soundStatus}</div>
                    </div>
                    <div class="game-item-thumb">
                        <img src="thumbs/${game.id}.png" 
                             onerror="if(this.src.endsWith('.png')){this.src='thumbs/${game.id}.jpg'}else{this.src='logo.png'}" 
                             alt="${game.name}">
                    </div>
                `;
                item.onclick = () => selectGame(game, item);
                gameList.appendChild(item);
            });
        }

        async function selectGame(game, itemElement) {
            if (currentGame?.id === game.id) return;
            
            // MAME/Emscripten usually doesn't like hot-swapping the whole core
            if (window.Module) {
                const t = langMap[currentLang];
                showModal(() => {
                    sessionStorage.setItem('auto_start_id', game.id);
                    window.location.reload();
                }, t.switchTitle, t.switchBody);
                return;
            }

            currentGame = game;
            document.querySelectorAll('.game-item').forEach(el => el.classList.remove('active'));
            itemElement.classList.add('active');
            
            // Ensure selected item is visible in the sidebar
            itemElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            welcomeScreen.classList.add('hidden');
            emulatorContainer.classList.remove('hidden');
            
            // Auto close sidebar on mobile after selection
            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                if (!sidebar.classList.contains('collapsed')) {
                    document.getElementById('sidebarToggle').click();
                }
            }
            
            // Sync toggle positions after showing container
            setTimeout(() => {
                const sidebar = document.getElementById('sidebar');
                const infoPanel = document.getElementById('infoPanel');
                document.getElementById('sidebarToggle').style.left = sidebar.classList.contains('collapsed') ? '0' : `${sidebar.offsetWidth - 16}px`;
                document.getElementById('infoToggle').style.right = infoPanel.classList.contains('collapsed') ? '0' : `${infoPanel.offsetWidth - 16}px`;
            }, 50);

            updateInfoPanel(game);
            await startEmulator(game);
        }

        function goHome() {
            sessionStorage.removeItem('auto_start_id');
            window.location.reload();
        }

        function toggleDebugDrawer(show) {
            const drawer = document.getElementById('debugDrawer');
            const arrow = document.getElementById('debugArrow');
            
            if (show === true) drawer.classList.add('active');
            else if (show === false) drawer.classList.remove('active');
            else drawer.classList.toggle('active');

            if (arrow) {
                arrow.textContent = drawer.classList.contains('active') ? '▼' : '▲';
            }
        }

        function showModal(onConfirm, title, body) {
            const modal = document.getElementById('confirmModal');
            const confirmBtn = document.getElementById('modalConfirm');
            const cancelBtn = document.getElementById('modalCancel');
            const modalTitle = modal.querySelector('.modal-title');
            const modalBody = modal.querySelector('.modal-body');

            const t = langMap[currentLang];
            confirmBtn.textContent = t.confirm;
            cancelBtn.textContent = t.cancel;

            if (title) modalTitle.textContent = title;
            if (body) modalBody.textContent = body;

            modal.classList.add('active');

            confirmBtn.onclick = () => {
                modal.classList.remove('active');
                onConfirm();
            };

            cancelBtn.onclick = () => {
                modal.classList.remove('active');
            };
        }

        function updateInfoPanel(game) {
            const content = document.getElementById('gameInfoContent');
            const labels = currentLang === 'zh' ? 
                { name: '名稱', en: '英文名', genre: '類型', year: '年份', dev: '開發商' } :
                { name: 'Name', en: 'English', genre: 'Genre', year: 'Year', dev: 'Dev' };

            content.innerHTML = `
                <p><strong>${labels.name}:</strong> ${game.nameCh}</p>
                <p><strong>${labels.en}:</strong> ${game.name}</p>
                <p><strong>${labels.genre}:</strong> ${game.genre}</p>
                <p><strong>${labels.year}:</strong> ${game.year}</p>
                <p><strong>${labels.dev}:</strong> ${game.developer}</p>
                <p style="margin-top:10px; color: #888;">${currentLang === 'zh' ? game.descCh : game.descEn}</p>
            `;
            gameTitleBar.textContent = `${currentLang === 'zh' ? game.nameCh : game.name}`;
        }

        async function startEmulator(game) {
            loadingTip.classList.remove('hidden');
            const canvas = document.getElementById('canvas');
            await window.AcanEmulator.start(canvas, game);
        }

        function setupInteractions() {
            searchBox.addEventListener('input', (e) => renderGames(e.target.value));

            const sidebar = document.getElementById('sidebar');
            const infoPanel = document.getElementById('infoPanel');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const infoToggle = document.getElementById('infoToggle');
            const leftResizer = document.getElementById('leftResizer');
            const rightResizer = document.getElementById('rightResizer');

            function toggleSidebar() {
                const isCollapsed = sidebar.classList.toggle('collapsed');
                sidebarToggle.textContent = isCollapsed ? '▶' : '◀';
                const currentWidth = sidebar.offsetWidth;
                if (isCollapsed) {
                    sidebar.style.marginRight = `-${currentWidth}px`;
                    sidebarToggle.style.left = '0';
                    sidebarToggle.classList.remove('embedded');
                } else {
                    sidebar.style.marginRight = '0';
                    sidebarToggle.style.left = `${currentWidth - 16}px`;
                    sidebarToggle.classList.add('embedded');
                }
                leftResizer.style.display = isCollapsed ? 'none' : 'flex';
            }

            function toggleInfo() {
                const isCollapsed = infoPanel.classList.toggle('collapsed');
                infoToggle.textContent = isCollapsed ? '◀' : '▶';
                const currentWidth = infoPanel.offsetWidth;
                if (isCollapsed) {
                    infoPanel.style.marginRight = `-${currentWidth}px`;
                    infoToggle.style.right = '0';
                    infoToggle.classList.remove('embedded');
                } else {
                    infoPanel.style.marginRight = '0';
                    infoToggle.style.right = `${currentWidth - 16}px`;
                    infoToggle.classList.add('embedded');
                }
                rightResizer.style.display = isCollapsed ? 'none' : 'flex';
            }

            sidebarToggle.onclick = (e) => { e.stopPropagation(); toggleSidebar(); };
            infoToggle.onclick = (e) => { e.stopPropagation(); toggleInfo(); };

            // Initial Position Sync
            const isSidebarCollapsed = sidebar.classList.contains('collapsed');
            sidebarToggle.style.left = isSidebarCollapsed ? '0' : `${sidebar.offsetWidth - 16}px`;
            if (!isSidebarCollapsed) sidebarToggle.classList.add('embedded');
            
            const isInfoCollapsed = infoPanel.classList.contains('collapsed');
            infoToggle.style.right = isInfoCollapsed ? '0' : `${infoPanel.offsetWidth - 16}px`;
            if (!isInfoCollapsed) infoToggle.classList.add('embedded');

            // Mobile optimization: Collapse right frame by default
            if (window.innerWidth <= 768) {
                infoPanel.classList.add('collapsed');
                infoToggle.textContent = '◀';
                infoToggle.style.right = '0';
                rightResizer.style.display = 'none';
                infoPanel.style.marginRight = `-${infoPanel.offsetWidth}px`;
            }

            // Resizing Logic
            let isResizingLeft = false;
            let isResizingRight = false;

            leftResizer.onmousedown = (e) => {
                if (e.target === sidebarToggle) return;
                isResizingLeft = true;
                document.body.style.cursor = 'col-resize';
            };

            rightResizer.onmousedown = (e) => {
                if (e.target === infoToggle) return;
                isResizingRight = true;
                document.body.style.cursor = 'col-resize';
            };

            window.onmousemove = (e) => {
                if (isResizingLeft) {
                    const newWidth = e.clientX;
                    if (newWidth > 200 && newWidth < 600) {
                        sidebar.style.width = `${newWidth}px`;
                        sidebarToggle.style.left = `${newWidth}px`;
                    }
                }
                if (isResizingRight) {
                    const rect = document.querySelector('.emulator-content').getBoundingClientRect();
                    const newWidth = rect.right - e.clientX;
                    if (newWidth > 200 && newWidth < 500) {
                        infoPanel.style.width = `${newWidth}px`;
                        infoToggle.style.right = `${newWidth}px`;
                    }
                }
            };

            window.onmouseup = () => {
                isResizingLeft = false;
                isResizingRight = false;
                document.body.style.cursor = 'default';
            };

            // Mobile Auto-Close
            window.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    if (!sidebar.contains(e.target) && !sidebar.classList.contains('collapsed') && !sidebarToggle.contains(e.target)) {
                        toggleSidebar();
                    }
                    if (!infoPanel.contains(e.target) && !infoPanel.classList.contains('collapsed') && !infoToggle.contains(e.target)) {
                        toggleInfo();
                    }
                }
            });

            // Mobile/Desktop switch resize listener
            let wasMobile = window.innerWidth <= 768;
            window.addEventListener('resize', () => {
                const isMobile = window.innerWidth <= 768;
                if (isMobile !== wasMobile) {
                    wasMobile = isMobile;
                    if (currentGame) {
                        const canvas = document.getElementById('canvas');
                        // Force Fit to Screen mode
                        canvas.classList.remove('native-scale');
                        canvas.width = 320;
                        canvas.height = 240;
                        canvas.style.width = '';
                        canvas.style.height = '';
                        
                        // Update button text
                        const t = langMap[currentLang];
                        const scaleBtn = document.getElementById('scaleBtn');
                        if (scaleBtn) scaleBtn.textContent = t.scaleNative; // Since it's now Fit to Screen, button shows "Native 2x"
                        
                        // Trigger resize for MAME
                        window.dispatchEvent(new Event('resize'));
                        
                        // Force collapse sidebars on mobile if open
                        if (isMobile) {
                            const sidebar = document.getElementById('sidebar');
                            const infoPanel = document.getElementById('infoPanel');
                            if (sidebar && !sidebar.classList.contains('collapsed')) {
                                toggleSidebar();
                            }
                            if (infoPanel && !infoPanel.classList.contains('collapsed')) {
                                toggleInfo();
                            }
                        }
                    }
                }
            });

            // Intercept keys
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement && currentGame) {
                        e.preventDefault();
                        e.stopPropagation();
                        const t = langMap[currentLang];
                        showModal(() => {
                            goHome();
                        }, t.exitTitle, t.exitBody);
                    }
                }
                if (e.key === 'F5' && currentGame) {
                    e.preventDefault(); // Prevent browser refresh
                }
            }, true);
            
            let isMuted = false;
            document.getElementById('muteBtn').onclick = () => {
                isMuted = !isMuted;
                window.AcanEmulator.toggleMute(isMuted);
                const t = langMap[currentLang];
                document.getElementById('muteBtn').textContent = isMuted ? t.unmute : t.mute;
            };

            // Video Mode Toggle
            const tInit = langMap[currentLang];
            window.videoMode = localStorage.getItem('videoMode') === 'soft' ? 'soft' : 'accel';
            document.getElementById('videoBtn').textContent = window.videoMode === 'accel' ? tInit.videoAccel : tInit.videoSoft;

            // Scale Mode Init
            const scaleMode = localStorage.getItem('scaleMode');
            const canvasElem = document.getElementById('canvas');
            if (scaleMode === 'native') {
                canvasElem.classList.add('native-scale');
                document.getElementById('scaleBtn').textContent = langMap[currentLang].scaleFit;
            }
            
            document.getElementById('videoBtn').onclick = () => {
                window.videoMode = window.videoMode === 'accel' ? 'soft' : 'accel';
                const t = langMap[currentLang];
                document.getElementById('videoBtn').textContent = window.videoMode === 'accel' ? t.videoAccel : t.videoSoft;
                
                // 使用 localStorage 記憶設定，不改動 URL，避免智障伺服器 404
                localStorage.setItem('videoMode', window.videoMode);
                
                // Show floating tip
                const tip = document.createElement('div');
                tip.style.cssText = 'position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.8); color: var(--primary-color); padding: 10px 20px; border-radius: 5px; z-index: 10000; border: 1px solid var(--primary-color);';
                tip.textContent = window.videoMode === 'accel' ? t.tipAccel : t.tipSoft;
                document.body.appendChild(tip);
                setTimeout(() => tip.remove(), 2000);
            };

            // Sound Mode Init
            window.soundMode = localStorage.getItem('soundMode') || 'auto';

            document.getElementById('soundBtn').onclick = () => {
                const states = ['auto', 'original', 'fixed'];
                let idx = states.indexOf(window.soundMode);
                idx = (idx + 1) % states.length;
                window.soundMode = states[idx];
                localStorage.setItem('soundMode', window.soundMode);
                updateUIStrings();

                const t = langMap[currentLang];
                const tip = document.createElement('div');
                tip.style.cssText = 'position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.8); color: var(--primary-color); padding: 10px 20px; border-radius: 5px; z-index: 10000; border: 1px solid var(--primary-color);';
                
                if (window.soundMode === 'fixed') tip.textContent = t.tipSoundFixed;
                else if (window.soundMode === 'original') tip.textContent = t.tipSoundOriginal;
                else tip.textContent = t.tipSoundAuto;
                
                document.body.appendChild(tip);
                setTimeout(() => tip.remove(), 2000);
            };

            document.getElementById('langToggle').onclick = () => {
                currentLang = currentLang === 'zh' ? 'en' : 'zh';
                localStorage.setItem('lang', currentLang);
                updateUIStrings();
            };

            document.getElementById('reloadBtn').onclick = () => {
                if (currentGame) {
                    sessionStorage.setItem('auto_start_id', currentGame.id);
                    window.location.reload();
                }
            };

            document.getElementById('fullscreenBtn').onclick = () => {
                const elem = document.getElementById('canvas');
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                
                // Listen for exiting fullscreen to reset resolution
                const exitHandler = () => {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const canvas = document.getElementById('canvas');
                        canvas.width = 320;
                        canvas.height = 240;
                        window.dispatchEvent(new Event('resize'));
                        document.removeEventListener('fullscreenchange', exitHandler);
                        document.removeEventListener('webkitfullscreenchange', exitHandler);
                    }
                };
                document.addEventListener('fullscreenchange', exitHandler);
                document.addEventListener('webkitfullscreenchange', exitHandler);
            };

            document.getElementById('scaleBtn').onclick = () => {
                const canvas = document.getElementById('canvas');
                const isNative = canvas.classList.toggle('native-scale');
                
                // 使用 localStorage 記憶設定
                localStorage.setItem('scaleMode', isNative ? 'native' : 'fit');
                
                // FORCE RESET: When toggling, reset the internal attributes to native A'Can resolution
                // This stops MAME from keeping fullscreen-sized attributes in windowed mode
                canvas.width = 320;
                canvas.height = 240;
                
                // Clear inline styles
                canvas.style.width = '';
                canvas.style.height = '';

                const t = langMap[currentLang];
                document.getElementById('scaleBtn').textContent = isNative ? t.scaleFit : t.scaleNative;
                
                // Trigger a window resize event to tell MAME to recalculate
                window.dispatchEvent(new Event('resize'));
            };
        }

        function checkAutoStart() {
            const autoStartId = sessionStorage.getItem('auto_start_id');
            if (autoStartId) {
                sessionStorage.removeItem('auto_start_id');
                const game = window.games.find(g => g.id === autoStartId);
                if (game) {
                    setTimeout(() => {
                        const items = document.querySelectorAll('.game-item');
                        for (let item of items) {
                            if (item.innerText.includes(game.nameCh)) {
                                selectGame(game, item);
                                break;
                            }
                        }
                    }, 300);
                }
            }
        }
    </script>
    
    <!-- Virtual Joypad Script -->
    <script>
        function initVirtualJoypad() {
            const buttons = document.querySelectorAll('.joy-btn-trigger');
            console.log(`[Joypad] Initializing ${buttons.length} buttons`);
            
            buttons.forEach(btn => {
                const keyAttr = btn.getAttribute('data-key');
                const codeAttr = btn.getAttribute('data-code');
                const keysAttr = btn.getAttribute('data-keys');
                const codesAttr = btn.getAttribute('data-codes');
                
                const keys = keysAttr ? keysAttr.split(',') : [keyAttr];
                const codes = codesAttr ? codesAttr.split(',') : [codeAttr];
                
                const handlePress = (e) => {
                    e.preventDefault();
                    // Simulate keydown
                    keys.forEach((key, index) => {
                        if (!key) return;
                        const event = new KeyboardEvent('keydown', { 
                            key: key, 
                            code: codes[index], 
                            bubbles: true,
                            cancelable: true
                        });
                        document.dispatchEvent(event);
                    });
                    
                    // Add active class for visual feedback on touch
                    if (!btn.classList.contains('dpad-diag')) {
                        btn.style.transform = 'translateY(4px)';
                        btn.style.boxShadow = '0 0 0 #111';
                        btn.style.background = 'var(--primary-color)';
                    }
                };
                
                const handleRelease = (e) => {
                    e.preventDefault();
                    // Simulate keyup
                    keys.forEach((key, index) => {
                        if (!key) return;
                        const event = new KeyboardEvent('keyup', { 
                            key: key, 
                            code: codes[index], 
                            bubbles: true,
                            cancelable: true
                        });
                        document.dispatchEvent(event);
                    });
                    
                    // Reset style
                    btn.style.transform = '';
                    btn.style.boxShadow = '';
                    btn.style.background = '';
                };
                
                btn.addEventListener('touchstart', handlePress, { passive: false });
                btn.addEventListener('touchend', handleRelease, { passive: false });
                btn.addEventListener('touchcancel', handleRelease, { passive: false });
                
                // Also support mouse for testing on desktop
                btn.addEventListener('mousedown', handlePress);
                btn.addEventListener('mouseup', handleRelease);
                btn.addEventListener('mouseleave', handleRelease);
            });
        }
        
        // Initialize when window loads
        window.addEventListener('load', () => {
            setTimeout(initVirtualJoypad, 1000);
        });

        function toggleControllerDrawer(show) {
            const drawer = document.getElementById('controllerDrawer');
            const arrow = document.getElementById('controllerArrow');
            const canvas = document.getElementById('canvas');
            
            if (show === true) drawer.classList.add('active');
            else if (show === false) drawer.classList.remove('active');
            else drawer.classList.toggle('active');
            
            const isActive = drawer.classList.contains('active');
            if (arrow) {
                arrow.textContent = isActive ? '▼' : '▲';
            }
            
            // Shrink canvas on desktop when drawer is active to prevent overlap
            if (window.innerWidth > 768) {
                if (isActive) {
                    canvas.style.setProperty('max-height', 'calc(100vh - 460px)', 'important');
                } else {
                    canvas.style.setProperty('max-height', '100%', 'important');
                }
                
                // Force reset canvas attributes to help MAME recalculate
                canvas.width = 320;
                canvas.height = 240;
                
                setTimeout(() => window.dispatchEvent(new Event('resize')), 300); // Wait for transition
            }
        }
    </script>
